<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة بناء المسجد النبوي ﷺ — لعبة تعليمية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg1:#F4FFFC;--bg2:#CDF5DE;--ink:#1F4B2C;--mut:#4f6a58;--p:#648D00;--pd:#3F7D20;--card:#fff;--c2:#f0f9f4;--c2b:#d9eee3;--line:#cfe7d9;--gold:#d9a920;--gold2:#FBF0A8;--ok:#648D00;--ok2:#d6f5e2;--bad:#d9534f;--bad2:#fde6e4;--sand:#ead9b5;--hi:rgba(255,255,255,.95);--sh:rgba(31,75,44,.26);--sh2:rgba(31,75,44,.13);--lc1:#fff;--lc2:#eef9f2;--fbg:#e4f3ea;--hf:'Baloo Bhaijaan 2','Tajawal',sans-serif;--clay:8px 10px 22px var(--sh),-6px -6px 14px var(--hi),inset 4px 4px 10px var(--hi),inset -5px -6px 12px var(--sh2);--press:inset 5px 5px 12px var(--sh2),inset -4px -4px 10px var(--hi);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#12301c;--bg2:#0b2112;--ink:#e9f7ef;--mut:#a5cdb8;--p:#C3E956;--pd:#91EAAF;--card:#1F4B2C;--c2:#2a5a38;--c2b:#3a6b45;--line:#3a6b45;--gold2:rgba(217,169,32,.22);--ok2:rgba(76,213,142,.22);--bad2:rgba(255,138,128,.2);--hi:rgba(255,255,255,.07);--sh:rgba(0,0,0,.5);--sh2:rgba(0,0,0,.3);--lc1:#255233;--lc2:#1c4429;--fbg:#12261d}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#12301c;--bg2:#0b2112;--ink:#e9f7ef;--mut:#a5cdb8;--p:#C3E956;--pd:#91EAAF;--card:#1F4B2C;--c2:#2a5a38;--c2b:#3a6b45;--line:#3a6b45;--gold2:rgba(217,169,32,.22);--ok2:rgba(76,213,142,.22);--bad2:rgba(255,138,128,.2);--hi:rgba(255,255,255,.07);--sh:rgba(0,0,0,.5);--sh2:rgba(0,0,0,.3);--lc1:#255233;--lc2:#1c4429;--fbg:#12261d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh;position:relative;background:radial-gradient(45% 30% at 8% 4%,rgba(145,234,175,.5),transparent 70%),radial-gradient(40% 35% at 96% 18%,rgba(195,233,86,.22),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;box-shadow:var(--clay)}
body:before{width:240px;height:240px;border-radius:50%;left:-80px;bottom:10vh;background:radial-gradient(circle at 30% 30%,#fff,#91EAAF)}
body:after{width:280px;height:280px;border-radius:46% 54% 50% 50%;right:-100px;top:26vh;background:radial-gradient(circle at 30% 30%,#fff,#C3E956)}
@media (prefers-color-scheme:dark){body:before,body:after{opacity:.25}}
@media(max-width:900px){body:before,body:after{display:none}}
.cl{display:none}
.wrap{max-width:1220px;margin:0 auto;padding:14px;position:relative;z-index:1}
.app{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
button{font-family:inherit;cursor:pointer}
.ico{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb{position:sticky;top:12px;border-radius:38px;padding:18px 12px;color:#fff;background:linear-gradient(160deg,#86c232,#3F7D20);border:0;box-shadow:8px 12px 26px rgba(10,90,52,.35),-5px -5px 14px var(--hi),inset 5px 5px 12px rgba(255,255,255,.45),inset -6px -8px 14px rgba(20,55,28,.35)}
.ub{text-align:center;margin-bottom:12px}
.av2{width:80px;height:80px;margin:0 auto 6px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--p);box-shadow:5px 7px 14px rgba(20,55,28,.35),inset -4px -5px 10px rgba(100,141,0,.18)}
.av2 svg{width:62px;height:62px}.av2 .ico{width:38px;height:38px}
.hi{font-family:var(--hf);font-weight:800;font-size:18px}
.nvs{display:grid;gap:8px}
.nv{display:flex;align-items:center;gap:10px;border:0;border-radius:22px;padding:9px 12px;background:rgba(255,255,255,.16);color:#fff;font-size:15px;text-align:right;box-shadow:inset 3px 3px 7px rgba(255,255,255,.3),inset -3px -4px 8px rgba(20,55,28,.25)}
.nv span{width:26px;display:flex;justify-content:center}.nv .ico{width:21px;height:21px}
.nv:hover:not(:disabled){background:rgba(255,255,255,.3)}
.nv:disabled{opacity:.4;cursor:default}
.tc{margin-top:14px;border-radius:28px;padding:12px;text-align:center;background:rgba(255,255,255,.18);font-size:14px;display:grid;gap:4px;box-shadow:inset 3px 3px 8px rgba(255,255,255,.3),inset -3px -4px 8px rgba(20,55,28,.25)}
.tc .crown{line-height:1;color:#F5DF4D}.crown .ico{width:36px;height:36px}.tc small{opacity:.9}
.tpb{height:12px;border-radius:99px;background:rgba(20,55,28,.3);overflow:hidden;box-shadow:inset 2px 2px 5px rgba(0,0,0,.25)}.tpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F5DF4D,#F18500);border-radius:99px;transition:width .5s}
@media(max-width:820px){.sb{position:static;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px}.ub{display:flex;align-items:center;gap:8px;margin:0}.av2{width:46px;height:46px;margin:0}.av2 svg{width:36px;height:36px}.hi{font-size:14px}.nvs{display:flex;flex:1;justify-content:flex-end;gap:4px}.nv{padding:7px 9px}.nv b{display:none}.tc{display:none}}
.top{background:var(--card);border-radius:999px;padding:8px 22px;margin-bottom:12px;box-shadow:var(--clay)}
.top h1{font-family:var(--hf);font-size:21px;margin:0;color:var(--pd);display:flex;align-items:center;gap:8px}.top .ico{width:26px;height:26px}
.bar{height:16px;background:var(--c2);border-radius:99px;overflow:hidden;margin-bottom:14px;box-shadow:var(--press)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C3E956,#648D00);border-radius:99px;transition:width .5s;box-shadow:inset 2px 2px 5px rgba(255,255,255,.55)}
.hb{display:none;align-items:center;gap:12px;padding:10px 20px;border-radius:36px;margin-bottom:14px;overflow:hidden;background:linear-gradient(120deg,#fff,#e3f9b9);box-shadow:var(--clay);color:#1F4B2C}
.hb h3{margin:0;font-family:var(--hf);font-size:21px}.hb p{margin:0;font-size:14px}
.hbc{width:100px;flex:none;margin-bottom:-18px}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:620px){.stt{grid-template-columns:1fr 1fr}}
.stl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:28px;box-shadow:var(--clay);color:#1F4B2C}
.s1{background:#d3f7e1}.s2{background:#fff}.s3{background:#eefbb8}.s4{background:#b5f0cb}
.si{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#86c232,#3F7D20);color:#fff;box-shadow:3px 4px 8px var(--sh),inset 2px 2px 5px rgba(255,255,255,.5),inset -3px -3px 6px rgba(20,55,28,.3);flex:none}.si .ico{width:24px;height:24px}
.stl small{display:block;font-size:13px;opacity:.8;line-height:1.2}.stl strong{font-family:var(--hf);font-size:21px;line-height:1.2}
.mg{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
@media(max-width:1000px){.mg{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:40px;padding:22px;box-shadow:var(--clay)}
.sd{display:grid;gap:16px}.sd .card{padding:16px;border-radius:34px}
.sd h3{margin:0 0 8px;font-family:var(--hf);font-size:17px;color:var(--pd)}
.ch{display:flex;gap:8px;align-items:flex-end;height:104px;padding-top:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
.col i{display:block;width:100%;border-radius:12px;background:linear-gradient(180deg,#C3E956,#648D00);box-shadow:inset 2px 2px 4px rgba(255,255,255,.55),inset -2px -3px 5px rgba(20,55,28,.25);transition:height .5s}
.stg{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{background:var(--c2);color:var(--pd);border-radius:999px;padding:3px 16px;font-size:13px;font-weight:700;box-shadow:var(--press)}
.pts{background:var(--gold2);color:#7a4a00;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
@media (prefers-color-scheme:dark){.pts{color:#ffd96a}}
.chip{background:var(--c2);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:3px 4px 9px var(--sh2),inset 2px 2px 5px var(--hi)}
.chip.gold{background:var(--gold2)}
h2{font-family:var(--hf);font-size:22px;margin:6px 0 14px;line-height:1.8;font-weight:600}
.tm{display:flex;align-items:center;gap:10px;margin:4px 0 8px;padding:6px 14px;border-radius:999px;background:var(--c2);box-shadow:var(--press);color:var(--pd)}
.tmt{flex:1;height:12px;border-radius:99px;background:rgba(100,141,0,.15);overflow:hidden}
.tmt i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#C3E956,#648D00);transition:width 1s linear,background .3s}
.tm b{font-family:var(--hf);font-size:22px;min-width:28px;text-align:center}.tm small{font-size:13px}
.tm.mid .tmt i{background:linear-gradient(90deg,#F5DF4D,#F18500)}
.tm.low{color:var(--bad);animation:tk 1s infinite}.tm.low .tmt i{background:linear-gradient(90deg,#ff9b94,#d9534f)}
@keyframes tk{50%{transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){.tm.low,.fb,.hero .big,.rw span,.bd span{animation:none}.tmt i,.bar i{transition:none}}
.opts{display:grid;gap:12px}.opts.t2{grid-template-columns:1fr 1fr}
.opt{text-align:right;background:var(--card);border:0;border-radius:26px;padding:13px 18px;font-size:17px;color:var(--ink);transition:.15s;box-shadow:5px 7px 15px var(--sh2),-4px -4px 10px var(--hi),inset 2px 2px 6px var(--hi),inset -3px -4px 8px var(--sh2)}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:6px 10px 18px var(--sh),-4px -4px 10px var(--hi),inset 2px 2px 6px var(--hi)}
.opt:active:not(:disabled){box-shadow:var(--press)}
.opt.tile{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.opt .ic{font-size:34px;line-height:1.2}
.opt.big{text-align:center;font-size:22px;font-weight:800;padding:18px}
.opt.sel{background:#e6f7bf;box-shadow:var(--press);outline:3px solid var(--p)}
.opt.ok{background:var(--ok2);outline:3px solid var(--ok);font-weight:700}
.opt.no{background:var(--bad2);outline:3px solid var(--bad)}
.opt:disabled{cursor:default}
@media (prefers-color-scheme:dark){.opt.sel{background:#3a6b45}}
.hint{color:var(--mut);font-size:14px;margin:-6px 0 10px}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:26px;margin-bottom:12px;background:var(--c2);box-shadow:var(--press)}
.slots .opt,.pool .opt{padding:8px 14px;font-size:16px}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.n{display:inline-block;background:var(--p);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;font-size:14px;margin-left:6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mt .opt{font-size:15px;padding:10px 12px}
.mt .opt.pick{outline:3px solid var(--p);transform:scale(1.03)}
.mt .opt.shake{animation:sk .35s}
@keyframes sk{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.cr2{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:10px;padding:8px 12px;border-radius:26px;background:var(--c2);box-shadow:var(--press)}
.cr2 .opt{padding:6px 12px;font-size:14px}
.cr2.ok{background:var(--ok2)}.cr2.no{background:var(--bad2)}
.btn{background:linear-gradient(160deg,#86c232,#3F7D20);color:#fff;border:0;border-radius:999px;padding:12px 32px;font-family:var(--hf);font-size:19px;font-weight:600;margin-top:12px;box-shadow:6px 10px 20px rgba(31,75,44,.35),inset 4px 4px 10px rgba(255,255,255,.5),inset -5px -6px 12px rgba(20,55,28,.35);transition:.12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(3px);box-shadow:2px 4px 10px rgba(31,75,44,.3),inset 4px 4px 10px rgba(20,55,28,.35)}
.btn.alt{background:linear-gradient(160deg,#fff,#e3f9b9);color:var(--pd);box-shadow:6px 10px 20px var(--sh),inset 3px 3px 8px #fff,inset -4px -5px 10px rgba(100,141,0,.2)}
.btn.wide{width:100%}.btn:disabled{cursor:default}
.fb{margin-top:16px;border-radius:30px;padding:14px 18px;animation:pop .35s;box-shadow:var(--clay)}
.fb.ok{background:var(--ok2)}.fb.mid{background:var(--gold2)}.fb.no{background:var(--bad2)}
.fb b{font-size:18px}
.rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rw span{background:var(--card);border-radius:999px;padding:2px 14px;font-weight:700;animation:pop .5s;box-shadow:3px 4px 9px var(--sh2)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
svg{width:100%;height:auto;display:block}
.pc{transition:opacity .8s}
.hs{cursor:pointer;transition:.2s}.hs:hover{filter:drop-shadow(0 0 5px var(--p))}.hs.ok{filter:drop-shadow(0 0 7px var(--ok))}.hs.no{filter:drop-shadow(0 0 7px var(--bad))}
.bd{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.bd span{background:var(--gold2);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;animation:pop .5s}
.hero{text-align:center;padding:10px 0}
.hero .big{width:128px;height:128px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:68px;line-height:1;color:var(--p);background:linear-gradient(145deg,#fff,#e3f9b9);box-shadow:8px 12px 24px var(--sh),inset 4px 4px 10px #fff,inset -6px -7px 14px rgba(100,141,0,.22);animation:pop .6s}
.hero .big .ico{width:72px;height:72px}
.hero h2{font-size:28px;color:var(--pd)}
.three{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.three .chip{font-size:15px;padding:6px 16px}
.cr{color:var(--mut);font-size:13px;margin-top:16px}
.stat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.scene{position:relative;display:flex;justify-content:center;padding:6px 0}
.pl{position:absolute;bottom:-8px;width:120px;z-index:1}.pl1{left:0}.pl2{right:0;transform:scaleX(-1)}
.l3{width:100%;max-width:390px;position:relative;z-index:2}
.lhd{background:linear-gradient(180deg,var(--lc1),var(--lc2));border-radius:44px 44px 14px 14px;padding:14px 16px 0;text-align:center;overflow:hidden;position:relative;box-shadow:var(--clay)}
.lhd .crown{color:#F18500;filter:drop-shadow(0 3px 2px rgba(150,110,0,.3))}.lhd .crown .ico{width:36px;height:36px;fill:#F5DF4D}
.lhd h2{margin:2px 0 0;color:var(--pd);font-size:30px;font-weight:800}
.sub{color:var(--mut);margin:0 0 6px;font-size:15px}
.hbub{position:absolute;top:92px;left:20px;width:46px;height:46px;border-radius:50%;background:#fff;color:#e8606d;display:flex;align-items:center;justify-content:center;box-shadow:4px 6px 12px var(--sh),inset -3px -3px 7px rgba(232,96,109,.18);z-index:2}.hbub .ico{width:24px;height:24px;fill:#ff8f99}
.chars{display:flex;justify-content:center;align-items:flex-end;height:155px}
.boy{width:190px;margin-bottom:-4px}.dog{width:98px;margin-inline-start:-22px;margin-bottom:-6px}
.lfm{background:linear-gradient(180deg,var(--lc2),var(--lc1));border-radius:14px 14px 44px 44px;padding:18px;box-shadow:var(--clay);text-align:center}
.field{display:flex;align-items:center;gap:10px;background:var(--fbg);border-radius:999px;padding:5px 6px 5px 18px;margin-bottom:14px;box-shadow:var(--press)}
.fi{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#86c232,#3F7D20);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:3px 5px 10px var(--sh),inset 2px 2px 5px rgba(255,255,255,.5),inset -3px -3px 6px rgba(20,55,28,.3);flex:none}.fi .ico{width:22px;height:22px}
.field input{flex:1;border:0;background:transparent;font-family:inherit;font-size:17px;color:var(--ink);padding:9px 0;outline:0;min-width:0}
.field:focus-within{outline:3px solid var(--p)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin:16px 0 10px}.or i{flex:1;height:3px;border-radius:9px;background:var(--line)}
.avs{display:flex;gap:12px;justify-content:center}
.av{width:60px;height:60px;border-radius:50%;border:0;padding:0;background:#fff;transition:.15s;box-shadow:4px 6px 12px var(--sh2),inset -3px -3px 7px rgba(100,141,0,.15),inset 2px 2px 5px #fff;overflow:hidden}
.av svg{width:100%;height:100%}
.av.on{outline:4px solid var(--p);transform:scale(1.1)}
.guest{background:none;border:0;color:var(--pd);font-weight:700;font-size:15px;margin-top:12px;text-decoration:underline}
.lb{width:100%;border-collapse:collapse;margin:10px 0}
.lb td,.lb th{padding:8px;border-bottom:2px solid var(--line);text-align:right}
.lb tr.me{background:var(--gold2);font-weight:700}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}

.av2{overflow:hidden}.av2 img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.hbc img{width:100%;height:auto;display:block}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:210px;margin:0 auto 8px}
.crew img{height:86%;width:auto;filter:drop-shadow(0 8px 7px rgba(31,75,44,.3))}.crew img:nth-child(2){height:100%}
.chars{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:186px;padding-top:6px}
.chb{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;opacity:.6;filter:saturate(.7);transition:.2s}
.chb img{height:128px;width:auto;transition:.2s}
.chb span{font-family:var(--hf);font-size:15px;line-height:1.5;color:var(--pd);background:var(--card);border-radius:99px;padding:0 14px;margin-top:-4px;position:relative;box-shadow:3px 4px 9px var(--sh2)}
.chb.on{opacity:1;filter:none}.chb.on img{height:146px}.chb.on span{background:var(--p);color:#fff}
.chb:hover{opacity:.9}

.tm b{min-width:46px}
.mapw{position:relative;max-width:440px;margin:0 auto}
.msv{width:100%;height:auto;display:block;direction:ltr;border-radius:40px;box-shadow:var(--clay)}
.pth{fill:none;stroke:#9fc58a;stroke-width:6;stroke-dasharray:1.1 1.7;stroke-linecap:round}
.pgr{fill:none;stroke:#648D00;stroke-width:7;stroke-linecap:round}
.stop{cursor:pointer}.stop.lock{cursor:not-allowed}
.stop circle{stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 4px 4px rgba(31,75,44,.35))}
.stop.done circle{fill:#648D00}.stop.cur circle{fill:#F18500;animation:pu 1.6s infinite}.stop.lock circle{fill:#cfe7d9}
.stop .mk{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop.lock .mk{stroke:#a3bfa9}
.sl,.ss{paint-order:stroke;stroke:#F4FFFC;stroke-width:5;stroke-linejoin:round;font-family:'Tajawal',sans-serif}
.sl{font-size:14.5px;font-weight:800;fill:#1F4B2C}.ss{font-size:12px;font-weight:700;fill:#4f6a58}
.stop.lock .sl{fill:#6b8573}
@keyframes pu{50%{transform:scale(1.12)}}
.guide{position:absolute;width:21%;max-width:96px;height:auto;transform:translate(-50%,-92%);transition:left 1.4s ease-in-out,top 1.4s ease-in-out;filter:drop-shadow(0 6px 5px rgba(31,75,44,.4));pointer-events:none}

.sb{background:linear-gradient(160deg,rgba(134,194,50,.9),rgba(63,125,32,.95)),var(--pt) center/cover}
.mqh{display:flex;justify-content:center;margin:0 auto 10px}.mqh img{height:190px;width:auto;filter:drop-shadow(0 10px 10px rgba(31,75,44,.25))}
.crew{height:150px;margin-bottom:12px}
.mapw{container-type:inline-size}
.mapin{--u:calc(100cqw/360);position:relative;aspect-ratio:360/748;direction:ltr;border-radius:40px;background:linear-gradient(180deg,#F4FFFC,#e9fbd0);box-shadow:var(--clay);overflow:hidden}
.mpl{position:absolute;inset:0;width:100%;height:100%}
.mpl path{fill:none;stroke:#b4d2a4;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.1 9}.mpl path.dn{stroke:#648D00}
.mpl circle{fill:#cfe0d3;stroke:#fff;stroke-width:4;filter:drop-shadow(0 2px 2px rgba(31,75,44,.3))}.mpl circle.dn{fill:#648D00}.mpl circle.cur{fill:#F18500}
.pill{position:absolute;display:flex;align-items:center;gap:calc(8*var(--u));padding:0 calc(10*var(--u));border:0;border-radius:calc(44*var(--u));color:#fff;font-family:inherit;background:linear-gradient(100deg,var(--a),var(--b));box-shadow:5px 8px 16px rgba(31,75,44,.3),inset 3px 3px 8px rgba(255,255,255,.35),inset -4px -5px 10px rgba(15,50,25,.3)}
.pill.o{flex-direction:row-reverse}
.pt{flex:1;direction:rtl;text-align:center;line-height:1.3;min-width:0}
.pt small{display:block;font-size:calc(10.5*var(--u));opacity:.9}.pt b{display:block;font-size:calc(13.5*var(--u));font-weight:800}
.pt em{font-style:normal;font-size:calc(11*var(--u));background:rgba(255,255,255,.22);border-radius:99px;padding:0 calc(8*var(--u));display:inline-block;margin-top:calc(2*var(--u))}
.pc{width:calc(56*var(--u));height:calc(56*var(--u));flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--b);box-shadow:3px 4px 8px rgba(15,50,25,.3),inset -3px -3px 7px rgba(100,141,0,.2)}.pc .ico{width:52%;height:52%}
.pill.done .pc{color:#648D00}.pill.cur .pc{color:#F18500}
.pill.cur{outline:calc(4*var(--u)) solid #F18500;outline-offset:calc(2*var(--u))}
.pill.lock{background:#e6f0e9;color:#5d7a66;box-shadow:var(--press);cursor:not-allowed}.pill.lock .pc{color:#a3bfa9}
.gpin{position:absolute;width:calc(40*var(--u));height:calc(40*var(--u));transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;border:calc(3*var(--u)) solid #F18500;background:#fff;transition:left 1.4s ease-in-out,top 1.4s ease-in-out;box-shadow:0 4px 8px rgba(31,75,44,.4);pointer-events:none;animation:bn 1.6s infinite}
.gpin img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
@keyframes bn{50%{margin-top:-4px}}
@media(prefers-reduced-motion:reduce){.gpin{animation:none;transition:none}}

const done=()=>S.A.filter(Boolean).length;
const score=()=>S.A.reduce((a,x)=>a+(x?x.pts:0),0);
function streak(){let k=0;for(const x of S.A){if(!x)break;k=x.full?k+1:0}return k}
function hud(){
  const bd=[],pc={};let ok=0;
  S.A.forEach((x,i)=>{if(x&&x.full){ok++;if(Q[i].b)bd.push(Q[i].b);if(Q[i].r)pc[Q[i].r]=1}});
  const sc=score();
  $('#t1').textContent=sc+' / '+TOT;$('#t2').textContent=ok+' / '+Q.length;$('#t3').textContent=streak();$('#t4').textContent=bd.length;
  $('#pb').style.width=(done()/Q.length*100)+'%';
  $('#tp').style.width=Math.min(100,Math.round(sc/TOT/.8*100))+'%';
  $('#bd').innerHTML=bd.length?bd.map(b=>'<span>'+b+'</span>').join(''):'<small style="color:var(--mut)">ستظهر شاراتك هنا</small>';
  const per=ST.map((_,s)=>{let e=0,t=0;Q.forEach((q,i)=>{if(q.s===s){t+=q.p;if(S.A[i])e+=S.A[i].pts}});return t?e/t:0});
  $('#ch').innerHTML=per.map((v,s)=>'<div class="col"><i style="height:'+Math.max(6,Math.round(v*80))+'px"></i><span>'+(s+1)+'</span></div>').join('');
  const fin=done()===Q.length&&sc/TOT>=.5;
  document.querySelectorAll('#ms .pc').forEach(g=>{const p=g.dataset.p;g.setAttribute('opacity',p==='dome'?(fin?1:0):(pc[p]?1:.12))});
  const v=S.view;
  $('#av').innerHTML=S.user?AVS[S.av]:ic('mosque');$('#hbc').innerHTML=S.user?AVS[S.av]:'';$('#hi').textContent=S.user?'أهلًا يا '+S.user+'!':'أهلًا بك!';
  const show=S.user&&(v==='q'||v==='lb'||v==='end');$('#hb').style.display=show?'flex':'none';
  if(show){const h=new Date().getHours();$('#hg').textContent=(h<12?'صباح الخير':h<18?'نهارك سعيد':'مساء الخير')+' يا '+S.user+'!';
    $('#hs').textContent=v==='q'?'المرحلة '+(Q[S.i].s+1)+': '+ST[Q[S.i].s]+' — هيا نكمل بناء المسجد!':v==='lb'?'تعرّف على أبطال بناء المساجد':'أنهيتَ الرحلة، أحسنت!'}
  $('#hm').disabled=v==='cover';$('#mp').disabled=!S.user||v==='map';
  $('#pv').disabled=!((v==='q'&&S.i>0)||v==='end');
  $('#nt').disabled=!(v==='q'&&S.A[S.i]);
  return {ok,bd};
}

function cover(){stopT();
  S.view='cover';hud();
  $('#card').innerHTML='<div class="hero"><div class="mqh"><img src="'+MQ+'" alt="المسجد النبوي"></div><div class="crew">'+['girl1','girl2','boy'].map(k=>'<img src="'+CH[k].s+'" alt="">').join('')+'</div><h2>رحلة بناء المسجد النبوي ﷺ</h2>'+
  '<p>اجمع النقاط، واجتز التحديات، واكتشف أسرار بناء المسجد النبوي ووظائفه وفضله.</p>'+
  '<div class="three"><span class="chip">'+ic('coin')+' اجمع النقاط</span><span class="chip">'+ic('medal')+' احصل على الشارات</span><span class="chip">'+ic('trophy')+' اربح الكأس</span><span class="chip">'+ic('clock')+' دقيقتان لكل سؤال</span></div>'+
  '<p style="color:var(--mut)">'+Q.length+' سؤالًا في 6 مراحل • كل إجابة صحيحة تقرّبك من لقب «بطل بناء المساجد»</p>'+
  '<button class="btn" id="go">ابدأ الرحلة</button>'+
  '<div class="cr">الاسم: تبارك محمود السعيد محمد • القسم: تكنولوجيا التعليم • الفرقة: الثالثة<br>الفئة: الصف الرابع الابتدائي • العام الدراسي 2026 | 2027<br>تحت إشراف: د. زينب أحمد علي، د. مها محمود</div></div>';

}

function login(){stopT();
  S.view='login';hud();
  const ks=Object.keys(CH);
  $('#card').innerHTML='<div class="scene"><div class="l3"><div class="lhd"><div class="crown">'+ic('crown')+'</div><h2>أهلًا بعودتك!</h2><p class="sub">اختر مستكشفك ثم سجّل دخولك</p><div class="chars" role="radiogroup" aria-label="اختر شخصيتك">'+ks.map(k=>'<button class="chb'+(k===S.av?' on':'')+'" data-a="'+k+'" role="radio" aria-checked="'+(k===S.av)+'" aria-label="'+CH[k].n+'"><img src="'+CH[k].s+'" alt=""><span>'+CH[k].n+'</span></button>').join('')+'</div></div>'+
  '<div class="lfm"><div class="field"><span class="fi">'+ic('user')+'</span><input id="nm" maxlength="24" autocomplete="off" placeholder="اسم اللاعب" value="'+clean(ls.get('mq_user')||'')+'"></div>'+
  '<div class="field"><span class="fi">'+ic('cap')+'</span><input id="cl" maxlength="20" autocomplete="off" placeholder="الفصل (اختياري)"></div>'+
  '<div id="er" style="color:var(--bad);min-height:22px;font-size:14px"></div><button class="btn wide" id="go" style="margin-top:0">دخول '+ic('enter')+'</button>'+
  '<div class="or"><i></i>أو<i></i></div><button class="btn alt wide" id="gs" style="margin-top:0">'+ic('user')+' ادخل كضيف</button></div></div></div>';
  document.querySelectorAll('.chb').forEach(b=>b.onclick=()=>{snd('tap');S.av=b.dataset.a;document.querySelectorAll('.chb').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)})});
  const enter=(n,c)=>{S.user=n;S.cl=c;ls.set('mq_user',n);snd('tap');S.A=[];mapv()};
  const go=()=>{const n=clean($('#nm').value.trim());if(n.length<2){$('#er').textContent='من فضلك اكتب اسمك (حرفان على الأقل)';snd('bad');return}enter(n,clean($('#cl').value.trim()))};
  $('#go').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#gs').onclick=()=>enter('ضيف '+(10+Math.floor(Math.random()*90)),'');
}

let TI=null;
const TB={tf:15,mc:20,multi:30,order:40,cls:35,hot:20,match:45};
const TL=q=>120;const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function stopT(){clearInterval(TI);TI=null}
function startT(q){stopT();const tot=TL(q);let l=tot;
  const tick=()=>{const s=$('#tms'),b=$('#tmb'),w=$('#tmw');if(!s){stopT();return}
    s.textContent=fmt(l);b.style.width=(l/tot*100)+'%';w.classList.toggle('mid',l/tot<=.5&&l>15);w.classList.toggle('low',l<=15);
    if(l<=0){stopT();timeUp();return}if(l<=3)snd('tap');l--};
  tick();TI=setInterval(tick,1000)}
function timeUp(){const i=S.i,q=Q[i];if(S.view!=='q'||S.A[i])return;
  const ck=$('#ck');if(ck&&!ck.disabled){ck.click();if(S.A[i])return}
  let p=0;if(q.t==='match')p=Math.round(q.p*document.querySelectorAll('[data-l].ok').length/q.m.length);
  document.querySelectorAll('#card .opt,#card .btn').forEach(x=>{x.disabled=true;if(typeof q.a==='string'&&x.dataset.v===q.a)x.classList.add('ok')});
  document.querySelectorAll('#hz .hs').forEach(x=>{x.style.pointerEvents='none';if(x.dataset.k===q.a)x.classList.add('ok')});
  fin(p,ansText(q),'<div>⏰ انتهى وقت السؤال.</div>')}

const MY=i=>64+124*i,MX=i=>i%2?38:322,MH=748;
const stageStat=s=>{let t=0,d=0;Q.forEach((q,i)=>{if(q.s===s){t++;if(S.A[i])d++}});return{t,d}};
const curStage=()=>{for(let s=0;s<ST.length;s++){const k=stageStat(s);if(k.d<k.t)return s}return ST.length};
function openStage(s){let i=Q.findIndex((q,k)=>q.s===s&&!S.A[k]);if(i<0)i=Q.findIndex(q=>q.s===s);snd('tap');ask(i)}
function mapv(walk){
  stopT();S.view='map';hud();
  const cur=curStage(),fin=cur>=ST.length,at=Math.min(cur,ST.length-1),from=walk?Math.max(0,at-1):at;
  const IC=['map','heart','medal','home','cap','trophy'],GR=[['#86c232','#648D00'],['#6fae28','#4D7111'],['#5a9a2a','#3F7D20'],['#3F7D20','#2c5f26'],['#2f6a2a','#1F4B2C'],['#285a2a','#173d23']];
  const pos=i=>'left:'+(MX(i)/360*100)+'%;top:'+(MY(i)/MH*100)+'%';
  const legs=[0,1,2,3,4].map(i=>{const a=MX(i),b=MX(i+1),y1=MY(i),y2=MY(i+1),m=(y1+y2)/2;return '<path class="'+(i<cur?'dn':'')+'" d="M'+a+' '+y1+'C'+a+' '+m+' '+b+' '+m+' '+b+' '+y2+'"/>'}).join('');
  const rings=ST.map((_,i)=>'<circle class="'+(i<cur?'dn':i===cur?'cur':'')+'" cx="'+MX(i)+'" cy="'+MY(i)+'" r="9"/>').join('');
  const pills=ST.map((n,i)=>{const k=stageStat(i),st=i<cur?'done':i===cur?'cur':'lock',x=i%2?110:12;
    return '<button class="pill '+st+(i%2?' o':'')+'" data-s="'+i+'" style="left:'+(x/360*100)+'%;top:'+((MY(i)-42)/MH*100)+'%;width:'+(238/360*100)+'%;height:'+(84/MH*100)+'%;--a:'+GR[i][0]+';--b:'+GR[i][1]+'" aria-label="المحطة '+(i+1)+': '+n+'"><span class="pt"><small>المحطة '+(i+1)+'</small><b>'+n+'</b><em>'+k.d+' / '+k.t+'</em></span><span class="pc">'+ic(st==='done'?'check':IC[i])+'</span></button>'}).join('');
  const msg=fin?'وصلنا إلى نهاية الرحلة! تعال نشوف نتيجتك.':'أنا يوسف، دليلك في الرحلة! اتبعني إلى المحطة '+(cur+1)+': '+ST[cur]+'. أمامك دقيقتان لكل سؤال.';
  $('#card').innerHTML='<h2 style="margin:0 0 10px">خريطة الرحلة</h2><div class="gb"><div class="gav">'+AVS.boy+'</div><p>'+msg+'</p></div>'+
  '<div class="mapw"><div class="mapin"><svg class="mpl" viewBox="0 0 360 '+MH+'" aria-hidden="true">'+legs+rings+'</svg>'+pills+'<div class="gpin" id="gd" style="'+pos(from)+'">'+AVS.boy+'</div></div></div>'+
  '<div style="text-align:center"><button class="btn" id="mgo">'+(fin?'عرض النتيجة النهائية':'ابدأ المحطة '+(cur+1))+'</button></div>';
  document.querySelectorAll('.pill').forEach(b=>{const s=+b.dataset.s;b.onclick=()=>{if(s<=cur)openStage(s);else snd('bad')}});
  $('#mgo').onclick=()=>{snd('tap');fin?end():openStage(cur)};
  if(from!==at){snd('ok');requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$('#gd');if(g){g.style.left=(MX(at)/360*100)+'%';g.style.top=(MY(at)/MH*100)+'%'}}))}
}
function ansText(q){
  if(q.t==='match')return q.m.map(m=>m[0]+' ← '+m[1]).join(' • ');
  if(q.t==='multi')return q.a.join('، ');
  if(q.t==='order')return q.items.join(' ← ');
  if(q.t==='cls')return q.items.map(x=>x[0]+': '+(x[1]?'نعم':'لا')).join(' • ');
  if(q.t==='hot')return HL[q.a];
  return q.a;
}
const ob=(o,c)=>{const a=Array.isArray(o);return '<button class="opt '+c+'" data-v="'+(a?o[1]:o)+'">'+(a?'<span class="ic">'+o[0]+'</span>'+o[1]:o)+'</button>'};

function ask(i){stopT();
  S.i=i;S.view='q';const q=Q[i],A=S.A[i];
  let h='<div class="stg"><span class="tag">المرحلة '+(q.s+1)+' من 6: '+ST[q.s]+'</span><span class="pts">'+q.p+' نقاط</span></div>'+
  '<div style="color:var(--mut);font-size:14px">السؤال '+(i+1)+' من '+Q.length+'</div><h2>'+q.q+'</h2>';
  if(A){
    $('#card').innerHTML=h+'<div class="fb '+(A.full?'ok':A.pts?'mid':'no')+'"><b>تمت الإجابة عن هذا السؤال</b> <span class="pts">+'+A.pts+' نقطة</span><div>الإجابة الصحيحة: <b>'+ansText(q)+'</b></div>'+(q.f?'<div>'+q.f+'</div>':'')+'</div><button class="btn" id="nx">'+(i<Q.length-1?(Q[i+1].s!==q.s?'عودة إلى الخريطة ◀':'السؤال التالي ◀'):'عرض النتيجة النهائية 🏆')+'</button>';
    hud();$('#nx').onclick=()=>{snd('tap');next()};return;
  }
  const T=q.t;h=h.replace('<h2>','<div class="tm" id="tmw">'+ic('clock')+'<div class="tmt"><i id="tmb"></i></div><b id="tms">'+fmt(TL(q))+'</b></div><h2>');
  if(T==='tf')h+='<div class="opts t2">'+q.o.map(o=>'<button class="opt big" data-v="'+o+'">'+(o==='صح'?'✅ ':'❌ ')+o+'</button>').join('')+'</div>';
  else if(T==='mc'){const ic=Array.isArray(q.o[0]);h+='<div class="opts'+(ic?' t2':'')+'">'+sh(q.o).map(o=>ob(o,ic?'tile':'')).join('')+'</div>'}
  else if(T==='multi')h+='<p class="hint">يمكنك اختيار أكثر من إجابة</p><div class="opts">'+sh(q.o).map(o=>ob(o,'')).join('')+'</div><button class="btn" id="ck">تحقق من إجابتي</button>';
  else if(T==='order')h+='<p class="hint">اضغط على العبارات بالترتيب الصحيح، واضغط على العبارة داخل المربع لإزالتها</p><div class="slots" id="sl"></div><div class="pool" id="pl"></div><button class="btn" id="ck" disabled style="opacity:.5">تحقق من إجابتي</button>';
  else if(T==='cls')h+='<p class="hint">اختر إجابة لكل عمل</p>'+q.items.map((x,k)=>'<div class="cr2" id="r'+k+'"><div>'+x[0]+'</div><button class="opt" data-k="'+k+'" data-v="1">'+q.y+'</button><button class="opt" data-k="'+k+'" data-v="0">'+q.n+'</button></div>').join('')+'<button class="btn" id="ck">تحقق من إجابتي</button>';
  else if(T==='hot')h+='<p class="hint">اضغط على الجزء داخل الصورة</p><div style="max-width:460px;margin:0 auto" id="hz">'+mosque('hot')+'</div>';
  else h+='<p class="hint">اضغط على العبارة ثم على ما يناسبها</p><div class="mt"><div class="L">'+q.m.map((m,k)=>'<button class="opt" data-l="'+k+'" style="width:100%;margin-bottom:10px">'+m[0]+'</button>').join('')+'</div><div class="R">'+sh(q.m.map(m=>m[1]).concat(q.x)).map(r=>'<button class="opt" data-r="'+r+'" style="width:100%;margin-bottom:10px">'+r+'</button>').join('')+'</div></div>';
  $('#card').innerHTML=h+'<div id="fb"></div>';hud();startT(q);
  if(T==='tf'||T==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.v===q.a;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add('ok')});
    if(!ok)b.classList.add('no');
    fin(ok?q.p:0,ok?'':q.a);
  });
  else if(T==='multi'){
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{snd('tap');b.classList.toggle('sel')});
    $('#ck').onclick=()=>{
      const bs=[...document.querySelectorAll('.opt')];
      if(!bs.some(b=>b.classList.contains('sel'))){snd('tap');return}
      let r=0,w=0;
      bs.forEach(b=>{const c=q.a.includes(b.dataset.v),s=b.classList.contains('sel');b.disabled=true;b.classList.remove('sel');
        if(c)b.classList.add('ok');else if(s)b.classList.add('no');
        if(c&&s)r++;else if(!c&&s)w++});
      $('#ck').remove();
      fin(Math.round(q.p*Math.max(0,r-w)/q.a.length),ansText(q),'<div>أصبتَ في '+r+' من '+q.a.length+(w?' واخترتَ '+w+' خيارًا خاطئًا':'')+'.</div>');
    };
  }else if(T==='order'){
    let pk=[];const pool=sh(q.items);
    const rd=()=>{
      $('#sl').innerHTML=pk.length?pk.map((x,k)=>'<button class="opt" data-x="'+k+'"><span class="n">'+(k+1)+'</span>'+x+'</button>').join(''):'<span style="color:var(--mut)">رتّب هنا…</span>';
      $('#pl').innerHTML=pool.filter(x=>!pk.includes(x)).map(x=>'<button class="opt" data-a="'+x+'">'+x+'</button>').join('');
      $('#sl').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{snd('tap');pk.splice(+b.dataset.x,1);rd()});
      $('#pl').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{snd('tap');pk.push(b.dataset.a);rd()});
      const f=pk.length===pool.length;$('#ck').disabled=!f;$('#ck').style.opacity=f?1:.5;
    };rd();
    $('#ck').onclick=()=>{
      let g=0;pk.forEach((x,k)=>{if(x===q.items[k])g++});
      $('#sl').querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.add(pk[k]===q.items[k]?'ok':'no')});
      $('#pl').innerHTML='';$('#ck').remove();
      fin(Math.round(q.p*g/q.items.length),ansText(q),'<div>وضعتَ '+g+' من '+q.items.length+' في مكانها الصحيح.</div>');
    };
  }else if(T==='cls'){
    const ch={};
    document.querySelectorAll('.cr2 .opt').forEach(b=>b.onclick=()=>{snd('tap');const k=b.dataset.k;ch[k]=b.dataset.v;document.querySelectorAll('.cr2 .opt[data-k="'+k+'"]').forEach(x=>x.classList.toggle('sel',x===b))});
    $('#ck').onclick=()=>{
      if(q.items.some((x,k)=>ch[k]===undefined)){snd('tap');return}
      let g=0;
      q.items.forEach((x,k)=>{const ok=(+ch[k])===x[1];if(ok)g++;$('#r'+k).classList.add(ok?'ok':'no');$('#r'+k).querySelectorAll('.opt').forEach(b=>b.disabled=true)});
      $('#ck').remove();
      fin(Math.round(q.p*g/q.items.length),ansText(q),'<div>أصبتَ في '+g+' من '+q.items.length+' عناصر.</div>');
    };
  }else if(T==='hot'){
    document.querySelectorAll('#hz .hs').forEach(g=>g.onclick=()=>{
      const ok=g.dataset.k===q.a;
      document.querySelectorAll('#hz .hs').forEach(x=>{x.style.pointerEvents='none';if(x.dataset.k===q.a)x.classList.add('ok')});
      if(!ok)g.classList.add('no');
      fin(ok?q.p:0,ok?'':HL[q.a]);
    });
  }else{
    let sel=null,mt=0,w=0;
    const Ls=[...document.querySelectorAll('[data-l]')],Rs=[...document.querySelectorAll('[data-r]')];
    Ls.forEach(b=>b.onclick=()=>{if(b.disabled)return;snd('tap');Ls.forEach(x=>x.classList.remove('pick'));sel=b;b.classList.add('pick')});
    Rs.forEach(b=>b.onclick=()=>{
      if(b.disabled||!sel)return;
      if(q.m[+sel.dataset.l][1]===b.dataset.r){
        sel.disabled=b.disabled=true;sel.classList.remove('pick');sel.classList.add('ok');b.classList.add('ok');sel=null;mt++;snd('ok');
        if(mt===q.m.length)fin(Math.max(0,Math.round(q.p*(q.m.length-w)/q.m.length)),'','<div>أخطأتَ في التوصيل '+w+' مرة.</div>');
      }else{w++;snd('bad');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}
    });
  }
}

function fin(pts,ans,info){stopT();
  const i=S.i,q=Q[i],full=pts===q.p,part=!full&&pts>0;
  S.A[i]={pts,full};
  const rw=(full&&q.b)?[q.b]:[];
  snd(full?(q.b?'badge':'ok'):part?'mid':'bad');
  if(full&&q.b)setTimeout(()=>snd('badge'),350);
  const t=full?OK[i%OK.length]:part?'إجابة جيدة، أصبتَ جزءًا منها':'لا بأس، حاول في السؤال التالي';
  let d=info&&!full?info:'';
  if(!full&&ans)d+='<div>الإجابة الصحيحة: <b>'+ans+'</b></div>';
  if(q.f&&(full||ans))d+='<div>'+q.f+'</div>';
  if(full&&q.r)d+='<div>تمت إضافة القطعة إلى صورة المسجد.</div>';
  $('#fb').innerHTML='<div class="fb '+(full?'ok':part?'mid':'no')+'"><b>'+(full?'✅ ':part?'🟡 ':'❌ ')+t+'</b> <span class="pts">+'+pts+' نقطة</span>'+d+
  (rw.length?'<div class="rw">'+rw.map(r=>'<span>'+r+'</span>').join('')+'</div>':'')+
  '<button class="btn" id="nx">'+(i<Q.length-1?(Q[i+1].s!==q.s?'عودة إلى الخريطة ◀':'السؤال التالي ◀'):'عرض النتيجة النهائية 🏆')+'</button></div>';
  hud();
  $('#nx').onclick=()=>{snd('tap');next()};
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){if(S.view==='q'){if(S.i>=Q.length-1)end();else if(Q[S.i+1].s!==Q[S.i].s)mapv(true);else ask(S.i+1)}}
function prev(){if(S.view==='end')ask(Q.length-1);else if(S.i>0)ask(S.i-1)}

async function saveLb(){
  const sc=score(),e={name:S.user,cl:S.cl,score:sc,tot:TOT,t:Date.now()};
  let L=ls.get('mq_lb')||[];
  const o=L.find(x=>x.name===e.name);
  if(!o)L.push(e);else if(sc>=o.score)Object.assign(o,e);
  ls.set('mq_lb',L);
  try{if(S.db){const ref=S.db.collection('lb').doc(encodeURIComponent(e.name));const s=await ref.get();
    if(!s.exists||(s.data().score||0)<=sc)await ref.set(e)}}catch(x){}
}
async function lboard(){stopT();
  S.view='lb';hud();
  $('#card').innerHTML='<h2>🏆 لوحة المتصدرين</h2><p style="color:var(--mut)">جارٍ التحميل…</p>';
  let L=(ls.get('mq_lb')||[]).slice(),shared=false;
  try{if(S.db){const sn=await Promise.race([S.db.collection('lb').get(),new Promise((_,r)=>setTimeout(r,6000))]);
    const m={};L.forEach(x=>m[x.name]=x);
    sn.docs.forEach(d=>{const v=d.data();if(v&&v.name&&(!m[v.name]||m[v.name].score<v.score))m[v.name]=v});
    L=Object.values(m);shared=true}}catch(x){}
  L.sort((a,b)=>b.score-a.score||a.t-b.t);
  const med=['🥇','🥈','🥉'];
  $('#card').innerHTML='<h2>🏆 لوحة المتصدرين</h2>'+(L.length?
  '<table class="lb"><tr><th>#</th><th>اللاعب</th><th>النقاط</th></tr>'+L.slice(0,10).map((x,k)=>'<tr class="'+(x.name===S.user?'me':'')+'"><td>'+(med[k]||k+1)+'</td><td>'+clean(x.name)+(x.cl?' <small style="color:var(--mut)">('+clean(x.cl)+')</small>':'')+'</td><td>'+x.score+' / '+(x.tot||TOT)+'</td></tr>').join('')+'</table>':
  '<p>لا توجد نتائج بعد. أنهِ الرحلة لتظهر في اللوحة!</p>')+
  '<p style="color:var(--mut);font-size:13px">'+(shared?'نتائج مشتركة بين اللاعبين.':'النتائج محفوظة على هذا الجهاز.')+' تُسجَّل نتيجتك عند إنهاء الرحلة.</p><button class="btn" id="bk">رجوع ◀</button>';
  $('#bk').onclick=()=>{snd('tap');if(!S.user)cover();else if(done()>=Q.length)end();else mapv()};
}

function end(){stopT();
  S.view='end';
  const p=Math.round(score()/TOT*100);
  const {ok,bd}=hud();
  if(p>=80)bd.push('🏆 كأس بطل بناء المساجد');
  const hero=p>=80?['🏆','بطل بناء المساجد']:p>=50?['🥈','مهندس مجتهد']:['🌱','باني مبتدئ'];
  saveLb();snd(p>=50?'win':'mid');
  $('#card').innerHTML='<div class="hero"><div class="big">'+hero[0]+'</div><h2>'+(p>=80?'مبارك يا '+S.user+'! حصلتَ على كأس «بطل بناء المساجد»':'أنهيتَ رحلة بناء المسجد النبوي')+'</h2>'+
  '<p style="font-size:20px;font-weight:700">لقبك: '+hero[1]+'</p>'+
  '<div class="stat"><span class="chip gold">'+ic('coin')+' '+score()+' من '+TOT+' ('+p+'٪)</span><span class="chip">'+ic('check')+' '+ok+' إجابة صحيحة كاملة</span><span class="chip">'+ic('medal')+' '+bd.length+' شارة</span></div>'+
  '<p style="color:var(--mut)">'+(p>=80?'المسجد النبوي مكتمل أمامك، وقد أتقنتَ رحلته بجدارة.':p>=50?'أحسنتَ! أعد المحاولة لتكمل بقية قطع المسجد وتفوز بالكأس.':'لا بأس، أعد الرحلة وتعلّم أكثر عن بناء المسجد النبوي وفضله.')+'</p>'+
  '<button class="btn" id="lb2">لوحة المتصدرين 🏆</button> <button class="btn alt" id="rp">إعادة الرحلة 🔄</button></div>';
  $('#rp').onclick=()=>{snd('tap');S.A=[];hud();mapv()};
  $('#lb2').onclick=()=>{snd('tap');lboard()};
}

$('#ms').innerHTML=mosque('side');
$('#mu').onclick=()=>{S.mute=!S.mute;$('#mu span').innerHTML=ic(S.mute?'mute':'sound');if(!S.mute)snd('tap')};
$('#mp').onclick=()=>{snd('tap');mapv()};
$('#hm').onclick=()=>{snd('tap');cover()};
$('#pv').onclick=()=>{snd('tap');prev()};
$('#nt').onclick=()=>{snd('tap');next()};
$('#lbb').onclick=()=>{snd('tap');lboard()};
try{if(window.claude&&claude.use)claude.use('db').then(d=>{S.db=d||null}).catch(()=>{})}catch(e){}
document.body.insertAdjacentHTML('beforeend','');
cover();
</script>
</body>
</html>
